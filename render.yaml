services:
  - type: web
    name: fake-news-detection
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT 
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
